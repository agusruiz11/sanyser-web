    <script type="application/ld+json">

          "@type": "Question",
          "name": "¿Cuál es el plazo de entrega habitual?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Para materiales de stock, el despacho es en el día o dentro de las 48 hs hábiles. Para materiales especiales o fabricación a medida, el plazo lo coordinamos con el cliente según el proyecto."
          }
        },
        {
          "@type": "Question",
          "name": "¿Tienen mínimo de compra?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "No exigimos mínimo de compra. Atendemos tanto a profesionales que necesitan materiales para una obra puntual como a empresas constructoras con pedidos de gran escala. Cada cliente recibe la misma atención."
          }
        },
        {
          "@type": "Question",
          "name": "¿Realizan proyectos de ingeniería sanitaria?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Sí. Contamos con un equipo de profesionales especializados que desarrolla proyectos completos: memorias de cálculo, planos, cómputos y especificaciones técnicas. También damos asistencia en obra para garantizar la correcta ejecución."
          }
        },
        {
          "@type": "Question",
          "name": "¿Fabrican colectores sanitarios a medida?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Sí. Fabricamos colectores en acero inoxidable y polipropileno con las dimensiones y configuraciones que el proyecto requiera. El plazo de fabricación se ajusta al cronograma de la obra."
          }
        },
        {
          "@type": "Question",
          "name": "¿Puedo visitar el showroom o el depósito?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Por supuesto. Estamos en Lomas de Zamora, Buenos Aires. Podés visitarnos de lunes a viernes de 8:00 a 18:00 hs y los días sábados de 8:00 a 13:00 hs. Te recomendamos coordinar visita con anticipación para que te atendamos con el tiempo que tu consulta merece."
          }
        },
        {
          "@type": "Question",
          "name": "¿Atienden a particulares o solo a empresas y profesionales?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Atendemos a todos: particulares, plomeros, instaladores, arquitectos, ingenieros y empresas constructoras. No hay mínimo de compra y todos los clientes reciben el mismo asesoramiento técnico."
          }
        },
        {
          "@type": "Question",
          "name": "¿Trabajan con obras públicas y licitaciones?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Sí. Tenemos experiencia en provisión de materiales para obras públicas y podemos emitir toda la documentación necesaria para procesos licitatorios: facturas, remitos, certificados de calidad y fichas técnicas."
          }
        },
        {
          "@type": "Question",
          "name": "¿Qué marcas de materiales sanitarios distribuyen?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Trabajamos con más de 25 marcas líderes: Hidro3, Acqua System, Caldaia, Roca, Awaduct, Duratop, Peisa, Vasser, FusioGas, Sigas, Rheem, Genebre, Pedrollo, Hidroflex, Tubotherm, Alarsa, Mi Pileta, Motorarg, Maygas, Tigre, Waterplast, Bombas Rowa, Piazza, TST, Peirano, Sherman, ESPA, Longvie, Volcan y Orbis."

        },

          "@type": "Question",
          "name": "¿Cómo puedo solicitar un presupuesto?",

            "@type": "Answer",
